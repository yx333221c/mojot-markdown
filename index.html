<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="墨记 Mojot —— 选中文本一键加格式的双栏 Markdown 编辑器" />
  <title>墨记 Mojot · Markdown 编辑器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/token.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- ===================== 顶部栏 ===================== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20">
            <rect x="2.5" y="2.5" width="27" height="27" rx="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <path d="M9 21V11l4 5 4-5v10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.5 11v10M20.5 21l3-3M20.5 21l-3-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">墨记</span>
        <span class="brand-pill">Mojot</span>
      </div>

      <div class="topbar-center">
        <div class="doc-title" id="docTitle" title="点击重命名文档">
          <input id="docTitleInput" class="doc-title-input" value="产品需求文档" aria-label="文档标题" maxlength="80" />
          <svg class="doc-title-chev" viewBox="0 0 16 16" width="13" height="13"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <span class="save-state" id="saveState"><span class="save-dot"></span><span id="saveText">已保存</span></span>
      </div>

      <div class="topbar-actions">
        <div class="view-switch" role="group" aria-label="视图模式">
          <button class="view-btn" data-view="edit" title="仅编辑">编辑</button>
          <button class="view-btn is-active" data-view="split" title="分栏">分栏</button>
          <button class="view-btn" data-view="preview" title="仅预览">预览</button>
        </div>
        <span class="tb-sep"></span>
        <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换主题">
          <svg class="ico-sun" viewBox="0 0 20 20" width="17" height="17"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.6v2.2M10 16.2v2.2M1.6 10h2.2M16.2 10h2.2M4 4l1.6 1.6M14.4 14.4L16 16M16 4l-1.6 1.6M5.6 14.4L4 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="ico-moon" viewBox="0 0 20 20" width="17" height="17"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="shareBtn" title="复制分享链接" aria-label="分享">
          <svg viewBox="0 0 20 20" width="17" height="17"><circle cx="15" cy="4.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="15.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 9l6-3.4M7 11l6 3.4" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="export-btn" id="exportBtn">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 2.5v9M6.5 8.5L10 12l3.5-3.5M3.5 14.5v2h13v-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导出
        </button>
        <div class="avatar" title="墨记 Mojot">M</div>
      </div>
    </header>

    <!-- ===================== 格式工具栏 ===================== -->
    <div class="toolbar" role="toolbar" aria-label="格式工具">
      <div class="tb-group">
        <button class="tbtn" data-menu="heading" title="标题样式 H1/H2/H3">
          <span class="tbtn-label">H</span>
          <svg class="caret" viewBox="0 0 12 12" width="9" height="9"><path d="M3 4.5L6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <span class="tb-div"></span>
      <div class="tb-group">
        <button class="tbtn" data-fmt="bold" title="加粗 (Ctrl+B)" aria-label="加粗"><b>B</b></button>
        <button class="tbtn" data-fmt="italic" title="斜体 (Ctrl+I)" aria-label="斜体"><i>I</i></button>
        <button class="tbtn" data-fmt="strike" title="删除线 (Ctrl+Shift+X)" aria-label="删除线"><s>S</s></button>
        <button class="tbtn tbtn-code" data-fmt="code" title="行内代码 (Ctrl+`)" aria-label="行内代码">
          <svg viewBox="0 0 18 18" width="15" height="15"><path d="M6.5 5L3 9l3.5 4M11.5 5L15 9l-3.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <span class="tb-div"></span>
      <div class="tb-group">
        <button class="tbtn" data-fmt="link" title="链接 (Ctrl+K)" aria-label="链接">
          <svg viewBox="0 0 18 18" width="15" height="15"><path d="M7.2 10.8l3.6-3.6M6 7.2l-1.4 1.4a2.55 2.55 0 0 0 3.6 3.6l1.4-1.4M12 10.8l1.4-1.4a2.55 2.55 0 0 0-3.6-3.6L8.4 7.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" data-fmt="image" title="插入图片" aria-label="图片">
          <svg viewBox="0 0 18 18" width="15" height="15"><rect x="2.5" y="3.5" width="13" height="11" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6.5" cy="7.5" r="1.3" fill="currentColor"/><path d="M3 12.5l3.5-3 2.5 2 3-2.5 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="tbtn" data-fmt="quote" title="引用块" aria-label="引用">
          <svg viewBox="0 0 18 18" width="15" height="15"><path d="M4 4v10M7.5 6.5h7M7.5 9.5h7M7.5 12.5h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" data-fmt="codeblock" title="代码块" aria-label="代码块">
          <svg viewBox="0 0 18 18" width="15" height="15"><rect x="2.5" y="3.5" width="13" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.6 7.4L4.8 9l1.8 1.6M11.4 7.4L13.2 9l-1.8 1.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <span class="tb-div"></span>
      <div class="tb-group">
        <button class="tbtn" data-fmt="ul" title="无序列表" aria-label="无序列表">
          <svg viewBox="0 0 18 18" width="15" height="15"><circle cx="4" cy="5" r="1.2" fill="currentColor"/><circle cx="4" cy="9" r="1.2" fill="currentColor"/><circle cx="4" cy="13" r="1.2" fill="currentColor"/><path d="M7.5 5h7M7.5 9h7M7.5 13h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" data-fmt="ol" title="有序列表" aria-label="有序列表">
          <svg viewBox="0 0 18 18" width="15" height="15"><text x="2" y="6.4" font-size="5" font-family="monospace" fill="currentColor">1</text><text x="2" y="10.6" font-size="5" font-family="monospace" fill="currentColor">2</text><text x="2" y="14.8" font-size="5" font-family="monospace" fill="currentColor">3</text><path d="M6.5 5h8M6.5 9h8M6.5 13h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" data-fmt="task" title="任务列表" aria-label="任务列表">
          <svg viewBox="0 0 18 18" width="15" height="15"><rect x="2.5" y="3.5" width="4.4" height="4.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.4 5.7l1.3 1.3 2-2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 5.7h6.5M9 12.7h6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2.5" y="10.5" width="4.4" height="4.4" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tbtn" data-fmt="table" title="插入表格" aria-label="表格">
          <svg viewBox="0 0 18 18" width="15" height="15"><rect x="2.5" y="3.5" width="13" height="11" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7.2h13M2.5 10.8h13M7 3.5v11M11.5 3.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="tbtn" data-fmt="hr" title="分割线" aria-label="分割线">
          <svg viewBox="0 0 18 18" width="15" height="15"><path d="M2.5 9h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 5.5h10M4 12.5h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".45"/></svg>
        </button>
      </div>
      <span class="tb-div"></span>
      <div class="tb-group">
        <button class="tbtn" data-fmt="undo" title="撤销 (Ctrl+Z)" aria-label="撤销">
          <svg viewBox="0 0 18 18" width="15" height="15"><path d="M6 5.5L3 8.5l3 3M3.4 8.5h7a4 4 0 0 1 0 8h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tbtn" data-fmt="redo" title="重做 (Ctrl+Y)" aria-label="重做">
          <svg viewBox="0 0 18 18" width="15" height="15"><path d="M12 5.5l3 3-3 3M14.6 8.5h-7a4 4 0 0 0 0 8h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="tb-right">
        <span class="hint-kbd"><kbd>Ctrl</kbd> + <kbd>B</kbd> 加粗</span>
        <button class="tbtn" id="moreBtn" title="更多工具" aria-label="更多">
          <svg viewBox="0 0 18 18" width="15" height="15"><circle cx="4" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="14" cy="9" r="1.4" fill="currentColor"/></svg>
        </button>
      </div>

      <!-- 下拉菜单：标题 -->
      <div class="dropdown" id="headingMenu" hidden>
        <button data-head="h1"><span class="dd-h1">H1</span> 一级标题 <kbd>Ctrl+1</kbd></button>
        <button data-head="h2"><span class="dd-h2">H2</span> 二级标题 <kbd>Ctrl+2</kbd></button>
        <button data-head="h3"><span class="dd-h3">H3</span> 三级标题 <kbd>Ctrl+3</kbd></button>
        <button data-head="p"><span class="dd-p">¶</span> 正文段落 <kbd>Ctrl+0</kbd></button>
      </div>
      <!-- 下拉菜单：导出 -->
      <div class="dropdown dropdown-right" id="exportMenu" hidden>
        <button data-export="html">导出为 <b>HTML</b></button>
        <button data-export="pdf">导出为 <b>PDF</b>（打印）</button>
        <button data-export="md">导出为 <b>.md 源文件</b></button>
        <div class="dd-line"></div>
        <button data-export="copy">复制 Markdown 到剪贴板</button>
      </div>
    </div>

    <!-- ===================== 主工作区 ===================== -->
    <main class="workspace" id="workspace" data-view="split">
      <!-- ---------- 左：源码编辑 ---------- -->
      <section class="pane pane-editor" id="paneEditor">
        <div class="pane-head">
          <span class="pane-label"><span class="pane-dot editor-dot"></span>源码</span>
          <span class="pane-meta">Markdown</span>
        </div>
        <div class="editor-body" id="editorBody">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <textarea id="source" class="source-input" spellcheck="false" autocomplete="off"
            autocapitalize="off" autocorrect="off" wrap="soft"
            aria-label="Markdown 源码编辑器" placeholder="在此输入 Markdown…"></textarea>
        </div>
        <div class="pane-foot">
          <span>UTF-8</span><span class="foot-dot">·</span><span>Markdown</span>
          <span class="foot-sp"></span>
          <span id="caretInfo">第 1 行, 第 1 列</span>
        </div>
      </section>

      <div class="splitter" id="splitter" title="拖动调整分栏"><span class="splitter-grip"></span></div>

      <!-- ---------- 右：渲染预览 ---------- -->
      <section class="pane pane-preview" id="panePreview">
        <div class="pane-head">
          <span class="pane-label"><span class="pane-dot preview-dot"></span>预览</span>
          <span class="pane-meta" id="zoomLabel">100%</span>
        </div>
        <div class="preview-scroll" id="previewScroll">
          <article class="markdown-body" id="previewBody"></article>
        </div>
        <div class="pane-foot">
          <span id="wordCount">0 字</span><span class="foot-dot">·</span><span id="readTime">约 1 分钟阅读</span>
          <span class="foot-sp"></span>
          <span class="sync-tag"><span class="sync-dot"></span>实时同步</span>
        </div>
      </section>
    </main>

    <!-- ===================== 底部状态栏 ===================== -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="status-item"><span class="online-dot"></span>本地草稿</span>
        <span class="status-item">自动保存已开启</span>
        <span class="status-item" id="lastEdit">刚刚编辑</span>
      </div>
      <div class="status-right">
        <span class="status-item" id="statusCaret">Ln 1, Col 1</span>
        <span class="status-item">空格: 2</span>
        <span class="status-item" id="statusWords">字数 0</span>
        <span class="status-item status-version">v1.0.0</span>
      </div>
    </footer>
  </div>

  <!-- 浮动格式气泡：选中文本后出现 -->
  <div class="bubble" id="bubble" hidden>
    <button data-fmt="bold" title="加粗"><b>B</b></button>
    <button data-fmt="italic" title="斜体"><i>I</i></button>
    <button data-fmt="strike" title="删除线"><s>S</s></button>
    <button data-fmt="code" title="行内代码">
      <svg viewBox="0 0 18 18" width="14" height="14"><path d="M6.5 5L3 9l3.5 4M11.5 5L15 9l-3.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="bubble-sep"></span>
    <button data-fmt="link" title="链接">
      <svg viewBox="0 0 18 18" width="14" height="14"><path d="M7.2 10.8l3.6-3.6M6 7.2l-1.4 1.4a2.55 2.55 0 0 0 3.6 3.6l1.4-1.4M12 10.8l1.4-1.4a2.55 2.55 0 0 0-3.6-3.6L8.4 7.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button data-fmt="quote" title="引用">❝</button>
  </div>

  <!-- 链接输入小浮层 -->
  <div class="link-pop" id="linkPop" hidden>
    <label for="linkUrl">链接地址</label>
    <input id="linkUrl" type="text" placeholder="https://example.com" />
    <div class="link-pop-actions">
      <button id="linkCancel">取消</button>
      <button id="linkConfirm" class="primary">确定</button>
    </div>
  </div>

  <!-- 更多工具菜单 -->
  <div class="dropdown dropdown-more" id="moreMenu" hidden>
    <button data-more="find">查找 / 替换 <kbd>Ctrl+F</kbd></button>
    <button data-more="clear">清空文档</button>
    <button data-more="sample">载入示例文档</button>
    <div class="dd-line"></div>
    <button data-more="about">关于墨记 Mojot</button>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
